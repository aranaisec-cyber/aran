[build-system]
# >=77 for PEP 639 SPDX `license = "MIT"` / `license-files` support.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aran"
version = "0.1.1"
description = "Aran — a transparent security proxy for MCP stdio servers: blocks destructive tool calls and redacts prompt-injection payloads before they reach your agent or your machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Aran" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "security",
    "prompt-injection",
    "ai-agents",
    "llm-security",
    "proxy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.0"]

[project.scripts]
aran = "aran.cli:main"

[project.urls]
Homepage = "https://github.com/aranaisec-cyber/aran"
Repository = "https://github.com/aranaisec-cyber/aran"
Issues = "https://github.com/aranaisec-cyber/aran/issues"
Security = "https://github.com/aranaisec-cyber/aran/security/policy"

[tool.setuptools.packages.find]
where = ["src"]

# The signature file must ship inside the wheel; otherwise a non-editable
# install falls back to the few hardcoded built-in signatures.
[tool.setuptools.package-data]
aran = ["default-rules.yaml"]
